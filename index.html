<!DOCTYPE html>
<html lang="es">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mini Finance is a simple financial management tool.">
    
    <title>Mini Finance</title>
    
    <link rel="stylesheet" href="assets/src/main.css">    
</head>
    <body>
        
        <!-- Navbar principal -->
        <header class="main-navbar">
    <div class="navbar-container">
        <a href="index.html" class="logo" aria-label="Mini Finance - Inicio">
            <span aria-hidden="true">💼</span>
            <strong>Mini <span class="accent-text">Finance</span></strong>
        </a>
        <nav aria-label="Navegación principal">
            <ul class="nav-links"> 
                <!-- Añadidas las clases requeridas por components.css y layout.css -->
                <li><a href="index.html" class="nav-link-home" aria-current="page"><span aria-hidden="true">🏠</span>Inicio</a></li>
                <li><a href="pages/dashboard.html" class="btn-secondary">Ir al Dashboard</a></li>
                <li>
                    <button id="theme-toggle" class="btn-theme-toggle" aria-label="Cambiar tema">
                        🌙
                    </button>
                </li>
            </ul>
        </nav>
    </div>
</header>
            <!-- Hero y carrusel de presentacion -->
            <main class="main-home">
                <section class="hero" aria-labelledby="hero-title">
                    <article class="hero-content">
                        <p class="hero-tag">Tus finanzas, bajo control</p>
                        <h1 id="hero-title">Tu Control <span class="accent-text">Financiero.</span><br>Sin Esfuerzo.</h1>
                        <p class="hero-description">Registra ingresos, controla tus gastos mensuales y alcanza tus metas de ahorro en un solo lugar.</p>
                        <a href="pages/dashboard.html" class="btn-primary">Comenzá GRATIS →</a>
                    </article>

                    <figure class="hero-carousel" aria-hidden="false">
                         <img src="assets/img/image1.png" alt="" class="carousel-slide active">
                         <img src="assets/img/image2.png" alt="" class="carousel-slide">
                         <img src="assets/img/image3.png" alt="" class="carousel-slide">
                            <!-- Flechas -->
                        <button class="carousel-btn prev" aria-label="Imagen anterior">❮</button>
                        <button class="carousel-btn next" aria-label="Siguiente imagen">❯</button>
                            <!-- Dots -->
                        <figcaption class="carousel-dots">
                            <button class="dot active" data-slide="0" aria-label="Ir a imagen 1"></button>
                            <button class="dot" data-slide="1" aria-label="Ir a imagen 2"></button>
                            <button class="dot" data-slide="2" aria-label="Ir a imagen 3"></button>
                        </figcaption>
                    </figure>
                </section>
            </main>

        <script  type="module" src="assets/scripts/main.js" defer></script>
