<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mini Finance Dashboard - Track and manage your personal financial activities, income, and expenses.">
    <link rel="stylesheet" href="assets/src/main.css">

    <title>Mini Finance - Dashboard</title>
</head>
<body>
    <main>
    <header>
        <h1>Panel de Registro</h1>
        <nav aria-label="Navegación del panel">
            <a href="../index.html">Inicio</a>
            <a href="resumen.html">Ver Resumen</a>
        </nav>
    </header>

    <!-- Contenedor de Alertas (Desafío Obligatorio) [cite: 261] -->
    <section id="alert-container" role="alert" aria-live="assertive"></section>

    <!-- Grilla de Métricas [cite: 4, 47] -->
    <section class="metrics-grid">
        <article class="card">
            <h3>Balance Neto</h3>
            <p id="balance-total">$0.00</p>
        </article>
        <article class="card income">
            <h3>Ingresos</h3>
            <p id="income-total">$0.00</p>
        </article>
        <article class="card expense">
            <h3>Gastos</h3>
            <p id="expense-total">$0.00</p>
        </article>
    </section>

    <div class="dashboard-content">

        <section class="form-container">
            <h2>Nuevo Movimiento</h2>
            <form id="finance-form">
                <label for="amount">Monto ($):</label>
                <input type="number" id="amount" required min="1" step="0.01">

                <label for="category">Categoría:</label>
                <select id="category">
                    <option value="vivienda">Vivienda</option>
                    <option value="comida">Alimentos</option>
                    <option value="transporte">Transporte</option>
                </select>

                <button type="submit" class="btn-primary">Registrar</button>
            </form>
        </section>


        <section class="recent-activity">
            <h2>Actividad Reciente</h2>
            <ul id="recent-list">

            </ul>
        </section>
    </div>
</main>


    <script type="module" src="assets/scripts/main.js" defer></script>
</body>
</html>
