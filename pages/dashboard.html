<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mini Finance Dashboard - Track and manage your personal financial activities, income, and expenses.">
    <link rel="stylesheet" href="../assets/src/main.css">
    <title>Mini Finance - Dashboard</title>
</head>
<body data-page="dashboard">

    <header class="main-navbar">
        <div class="navbar-container">
            <a href="../index.html" class="logo" aria-label="Mini Finance - Volver al inicio">
                <span aria-hidden="true">💼</span>
                <strong>Mini <span class="accent-text">Finance</span></strong>
            </a>
            <nav aria-label="Navegación del panel">
                <ul class="nav-links">
                    <li><a href="../index.html" class="nav-link-home"><span aria-hidden="true">🏠</span>Inicio</a></li>
                    <li><a href="resumen.html" class="btn-secondary">Ver Resumen</a></li>
                    <li>
                        <button id="theme-toggle" class="btn-theme-toggle" aria-label="Cambiar tema">
                            🌙
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="alert-container" role="alert" aria-live="assertive"></section>

        <section class="metrics-grid">
            <article class="metric-card card-balance">
                <h3>Balance Neto</h3>
                <p id="balance-total" class="card-value">$0.00</p>
            </article>
            <article class="metric-card card-income">
                <h3>Ingresos</h3>
                <p id="income-total" class="card-value">$0.00</p>
            </article>
            <article class="metric-card card-expense">
                <h3>Gastos</h3>
                <p id="expense-total" class="card-value">$0.00</p>
            </article>
        </section>


        <div class="dashboard-grid">
            
            <section class="section-card" aria-labelledby="form-title">
                <h2 id="form-title">Nuevo Movimiento</h2>
                <form id="finance-form" novalidate>
                    <div class="form-group">
                        <label for="amount">Monto ($):</label>
                        <input type="number" id="amount" required min="0.01" step="0.01" placeholder="Monto ($)" aria-required="true" aria-describedby="amount-error">
                        <span id="amount-error" class="error-message" role="status" aria-live="polite"></span>
                    </div>

                    <div class="form-group">
                        <fieldset class="type-fieldset">
                            <legend>Tipo:</legend>
                            <div class="type-options">
                                <label class="type-label type-income">
                                    <input type="radio" name="type" value="income" checked>
                                    Ingreso
                                </label>
                                <label class="type-label type-expense">
                                    <input type="radio" name="type" value="expense">
                                    Gasto
                                </label>
                            </div>
                        </fieldset>
                    </div>

                    <div class="form-group">
                        <label for="category">Categoría:</label>
                        <select id="category" required aria-required="true">
                            <option value="vivienda">Vivienda</option>
                            <option value="comida">Alimentos</option>
                            <option value="transporte">Transporte</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-primary btn-block">Registrar Transacción</button>
                </form>
            </section>

            <section class="section-card recent-activity" aria-labelledby="activity-title">
                <h2 id="form-title">Actividad Reciente</h2>
                <div class="movements-list-wrapper" role="region" aria-label="Lista de movimientos recientes">
                    <ul id="recent-list" aria-live="polite">
                    </ul>
                </div>
            </section>
        </div>
    </main>


    <script type="module" src="../assets/scripts/main.js" defer></script>
</body>
</html>
