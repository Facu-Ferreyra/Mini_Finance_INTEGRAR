<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Finance - Resumen</title>
    <link rel="stylesheet" href="../assets/src/main.css">
</head>
<body data-page="resumen">
    
    <header class="main-navbar">
        <div class="navbar-container">
            <a href="../index.html" class="logo" aria-label="Mini Finance - Volver al inicio">
                <span aria-hidden="true">💼</span>
                <strong>Mini <span class="accent-text">Finance</span></strong>
            </a>
            <nav aria-label="Navegación principal">
                <ul class="nav-links">
                    <li><a href="../index.html" class="nav-link-home"><span aria-hidden="true">🏠</span>Inicio</a></li>
                    <li><a href="dashboard.html" class="btn-secondary">Dashboard</a></li>
                    <li>
                        <button id="theme-toggle" class="btn-theme-toggle" aria-label="Cambiar tema">
                            🌙
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="goal-container">
            <h2>Meta: <span id="goal-name">Cargando...</span></h2>
            <div class="progress-bar-bg" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="goal-progress" class="progress-fill"></div>
            </div>
            <p id="goal-status">Faltan $0 para completar tu objetivo.</p>
        </section>

        <article class="metric-card card-savings">
            <h3>Porcentaje de Ahorro</h3>
            <p id="savings-rate" class="card-value">0%</p>
        </article>

        <section class="section-card" aria-labelledby="goal-form-title">
            <h2 id="goal-form-title">Configurar Meta</h2>
            <div class="form-group">
                <label for="goal-name-input">Nombre de la meta:</label>
                <input type="text" id="goal-name-input" placeholder="Ej: Viaje 2026"
                    aria-describedby="goal-name-error">
                <span id="goal-name-error" class="error-message" 
                    role="status" aria-live="polite"></span>
            </div>
            <div class="form-group">
                <label for="goal-amount-input">Monto objetivo ($):</label>
                <input type="number" id="goal-amount-input" min="1" step="0.01"
                    placeholder="0.00" aria-describedby="goal-amount-error">
                <span id="goal-amount-error" class="error-message" 
                    role="status" aria-live="polite"></span>
            </div>
            <button type="button" id="save-goal-btn" class="btn-primary btn-block">
                Guardar Meta
            </button>
            <button type="button" id="delete-goal-btn" class="btn-danger btn-block">
                Eliminar Meta
            </button>
        </section>

        <section class="metrics-grid" aria-label="Métricas de ahorro">
            <article class="metric-card card-balance">
                <h3>Balance Neto</h3>
                <p id="balance-total" class="card-value">$0.00</p>
            </article>
            <article class="metric-card card-income">
                <h3>Ingresos</h3>
                <p id="income-total" class="card-value">$0.00</p>
            </article>
            <article class="metric-card card-savings">
                <h3>Porcentaje de Ahorro</h3>
                <p id="savings-rate" class="card-value">0%</p>
            </article>
        </section>


        <section class="section-card history-container">
            <h2>Historial Completo</h2>
            <div class="form-group filter-group">
                <label for="filter-category">Filtrar por:</label>
                <select id="filter-category" aria-controls="history-body">
                    <option value="all">Todas las categorías</option>
                </select>
            </div>
            
            <div class="movements-list-wrapper" role="region" aria-label="Historial de movimientos">
                <table class="history-table">
                    <caption class="visually-hidden">Historial completo de movimientos financieros</caption>
                    <thead>
                        <tr>
                            <th scope="col">Fecha</th>
                            <th scope="col">Categoría</th>
                            <th scope="col">Monto</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                    </tbody>
                </table>
            </div>
        </section>
    </main>
            
    <script type="module" src="../assets/scripts/main.js" defer></script>
</body>
</html>
