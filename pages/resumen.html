<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Finance - Resumen</title>
    <link rel="stylesheet" href="../assets/src/main.css">
</head>
<body>
    
    <header class="main-navbar">
        <div class="navbar-container">
            <a href="../index.html" class="logo" aria-label="Mini Finance - Volver al inicio">
                Mini <span class="accent-text">Finance</span>
            </a>
            <nav aria-label="Navegación principal">
                <ul class="nav-links">
                    <li><a href="../index.html" class="nav-link-home">Inicio</a></li>
                    <li><a href="dashboard.html" class="btn-secondary">Dashboard</a></li>
                    <li>
                        <button id="theme-toggle" class="btn-theme-toggle" aria-label="Cambiar tema">
                            🌙
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="goal-container">
            <h2>Meta: <span id="goal-name">Cargando...</span></h2>
            <div class="progress-bar-bg" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="goal-progress" class="progress-fill"></div>
            </div>
            <p id="goal-status">Faltan $0 para completar tu objetivo.</p>
        </section>

        <section class="section-card history-container">
            <h2>Historial Completo</h2>
            <div class="form-group" style="max-width: 300px; margin-bottom: 1.5rem;">
                <label for="filter-category">Filtrar por:</label>
                <select id="filter-category">
                    <option value="all">Todas las categorías</option>
                </select>
            </div>
            
            <div class="movements-list-wrapper">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Categoría</th>
                            <th>Monto</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                    </tbody>
                </table>
            </div>
        </section>
    </main>
            
    <script type="module" src="../assets/scripts/main.js" defer></script>
</body>
</html>
